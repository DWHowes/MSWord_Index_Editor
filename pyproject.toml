[build-system]
# Pinned past 1.26.2: the license field below is a PEP 639 SPDX expression
# rather than the old table form, and hatchling only implements the accepted
# PEP from 1.26.0 (metadata 2.4) with back-population fixed in 1.26.2.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wordindexeditor"
version = "0.0.1.dev0"
description = "Word Index Editor -- indexing tool for Microsoft Word documents, built on bookindexcore"
readme = "README.md"
requires-python = ">=3.12"
# MIT, matching the LICENSE file beside it and the other three projects. This
# said `Proprietary` while the repository carried an MIT LICENSE -- two
# different answers in one package, corrected 16 August 2026.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "D. W. Howes" }]

# bookindexcore is installed with NO extras, deliberately. A dialect and a
# backend are headless -- no Qt, no display -- and that is the whole point of
# the packaging rule the shared package asserts in
# tests/test_no_third_party_in_core.py. Until a second application actually
# installs it that way, the assertion is only as good as its own test.
#
# lxml is this application's dependency, not the core's. Word's index markup
# is XML inside a zip; there is no reading it without a parser.
dependencies = ["lxml>=5.0"]

[project.optional-dependencies]
# The UI needs Qt; the in-app Help needs a Markdown parser, because the topics
# ship as Markdown and `bookindexcore.ui.help.content_model` renders them.
# Declared here rather than left to the core's own `help` extra: an
# application that shows Help is an application that depends on it, and an
# ImportError at the moment a user presses F1 is the worst place to find out.
# `rapidfuzz` is here because the shared Advanced Search *offers* a fuzzy
# tab, and the core imports it lazily so that exact search works without
# it. That laziness is right for the library and wrong for an
# application that ships the control: without this line a packaged build
# shows an indexer a tab that says the package is not installed. Found by
# taking the User Guide's screenshot of that very window.
qt  = ["PySide6-Essentials>=6.11", "shiboken6>=6.11", "markdown-it-py>=3.0",
       "rapidfuzz>=3.9"]
dev = ["pytest>=8.0"]

[project.scripts]
# Agrees with `main.py` at the repository root deliberately: that is what a
# person types, this is what a packaged build wants.
wordindexeditor = "wordindex.ui.main_window:run"

[tool.hatch.build.targets.wheel]
packages = ["src/wordindex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
